
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizMaster</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #100b1d;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: #1c1530;
    width: 100%;
    max-width: 650px;
    padding: 35px;
    border-radius: 18px;
    border: 1px solid #49366b;
    box-shadow: 0 0 30px #00000055;
}

h1 {
    text-align: center;
    color: #c4a3ff;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa0bd;
    margin-bottom: 30px;
}

.info {
    display: flex;
    justify-content: space-between;
    color: #c4a3ff;
    margin-bottom: 20px;
}

.progress {
    height: 7px;
    background: #382b50;
    border-radius: 10px;
    margin-bottom: 25px;
}

.progress-bar {
    height: 7px;
    background: #a56bff;
    width: 0%;
    border-radius: 10px;
}

h2 {
    font-size: 21px;
    margin-bottom: 25px;
    line-height: 1.5;
}

.option {
    background: #2a2040;
    border: 1px solid #49366b;
    padding: 15px;
    margin: 12px 0;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    border-color: #b68aff;
    background: #382653;
}

.option.correct {
    background: #176b42;
    border-color: #32d583;
}

.option.wrong {
    background: #8b2635;
    border-color: #ff6878;
}

.option.disabled {
    pointer-events: none;
}

button {
    background: #9855ee;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 9px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #7e3ed0;
}

#nextBtn {
    display: none;
    width: 100%;
}

#result {
    text-align: center;
    display: none;
}

#result h2 {
    color: #c4a3ff;
    font-size: 30px;
}

#result p {
    margin: 15px;
    color: #ddd;
    font-size: 18px;
}

#feedback {
    margin-top: 15px;
    min-height: 20px;
    color: #c4a3ff;
}
</style>
</head>

<body>

<div class="container">

    <h1>QuizMaster</h1>
    <p class="subtitle">Challenge Your Knowledge</p>

    <div id="quiz">

        <div class="info">
            <span id="questionNumber">Question 1/5</span>
            <span id="score">Score: 0</span>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <h2 id="question">Question appears here</h2>

        <div id="options"></div>

        <p id="feedback"></p>

        <button id="nextBtn" onclick="nextQuestion()">
            Next Question →
        </button>

    </div>

    <div id="result">
        <h2>Quiz Completed!</h2>
        <p id="finalScore"></p>
        <p id="percentage"></p>
        <button onclick="restartQuiz()">Restart Quiz</button>
    </div>

</div>



<script>

let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;

// Get questions from Java backend
async function fetchQuestions() {
    try {
        const response = await fetch("/api/questions");

        if (!response.ok) {
            throw new Error("Questions could not be loaded");
        }

        questions = await response.json();

        currentQuestion = 0;
        score = 0;

        loadQuestion();

    } catch (error) {
        document.getElementById("question").innerText =
            "Unable to load quiz. Please refresh the page.";

        console.error(error);
    }
}

// Display question
function loadQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("question").innerText = q.question;

    document.getElementById("questionNumber").innerText =
        `Question ${currentQuestion + 1}/${questions.length}`;

    document.getElementById("score").innerText = "Score: " + score;

    document.getElementById("progressBar").style.width =
        (currentQuestion / questions.length * 100) + "%";

    document.getElementById("feedback").innerText = "";

    document.getElementById("nextBtn").style.display = "none";

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {

        const div = document.createElement("div");

        div.className = "option";
        div.innerText = option;

        div.onclick = function() {
            checkAnswer(index, div);
        };

        optionsDiv.appendChild(div);

    });
}

// Send selected answer to Java backend
async function checkAnswer(selected, selectedDiv) {

    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const allOptions = document.querySelectorAll(".option");

    allOptions.forEach(option => {
        option.classList.add("disabled");
    });

    try {

        const response = await fetch("/api/check-answer", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                questionId: q.id,
                selectedAnswer: selected
            })
        });

        if (!response.ok) {
            throw new Error("Answer checking failed");
        }

        const result = await response.json();

        if (result.correct) {

            score++;

            selectedDiv.classList.add("correct");

        } else {

            selectedDiv.classList.add("wrong");

        }

        document.getElementById("feedback").innerText =
            result.message;

        document.getElementById("score").innerText =
            "Score: " + score;

        document.getElementById("nextBtn").style.display = "block";

    } catch (error) {

        answered = false;

        allOptions.forEach(option => {
            option.classList.remove("disabled");
        });

        document.getElementById("feedback").innerText =
            "Something went wrong. Please try again.";

        console.error(error);
    }
}

// Next question
function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        loadQuestion();

    } else {

        showResult();

    }
}

// Final result
function showResult() {

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    const percentage = (score / questions.length) * 100;

    document.getElementById("progressBar").style.width = "100%";

    document.getElementById("finalScore").innerText =
        `Your Score: ${score}/${questions.length}`;

    document.getElementById("percentage").innerText =
        `Percentage: ${percentage}%`;
}

// Restart quiz
function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("quiz").style.display = "block";

    document.getElementById("result").style.display = "none";

    loadQuestion();
}

// Start quiz
fetchQuestions();

</script>

</body>
</html>
